<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}자동매매{% endblock %}</title>
    <style>
      /* Section 12: desktop-first with a persistent navigation rail and a
         narrow-screen fallback. Eight screens had eight copies of a style
         block, so the same table looked different depending on where the
         operator had clicked. One stylesheet, defined once. */
      :root {
        /* Ink and paper. The canvas is a shade off white and the things you
           read sit on true white, so depth comes from luminance rather than
           from drawing a box around everything. */
        --ink: #14161a;
        /* Was #6b6b6b, which fails contrast at the sizes it is used at.
           Secondary text on this screen is often the only label a number
           has. */
        --muted: #5b626d;
        --faint: #858c97;
        --line: #e7e9ee;
        --line-strong: #d0d5dd;
        --page: #f6f7f9;
        --surface: #ffffff;
        --rail: #fbfbfc;
        --raised: #ffffff;
        --hover: #f4f6f9;
        --focus: #17457f;
        --danger: #a51c30;
        --danger-ink: #7d1424;
        --danger-bg: #fdf3f4;
        --ok: #16663a;
        --ok-bg: #f1f8f3;
        --accent: #17457f;
        --accent-soft: #eef3fa;
        --warn-bg: #fdf8ec;

        /* One radius scale and one elevation scale, so nothing is rounded or
           lifted by a number somebody picked once. */
        --radius-sm: 5px;
        --radius: 8px;
        --radius-lg: 12px;
        --shadow-sm: 0 1px 2px rgb(16 18 22 / 4%), 0 1px 3px rgb(16 18 22 / 5%);
        --shadow-md: 0 2px 4px rgb(16 18 22 / 4%), 0 8px 20px rgb(16 18 22 / 7%);
        --shadow-lg: 0 12px 48px rgb(16 18 22 / 18%);
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--page);
        /* Pretendard first where it is installed - it is the Korean face
           most of this audience already has, and it sets Hangul and Latin at
           one weight. Everything after it ships with the operating system:
           no webfont is fetched, because an operations console should not
           wait on a font server to say the loop has stopped. */
        font-family: Pretendard, "Pretendard Variable", -apple-system,
          "Apple SD Gothic Neo", system-ui, "Segoe UI Variable Text",
          "Segoe UI", "Malgun Gothic", sans-serif;
        font-size: 15px;
        line-height: 1.62;
        letter-spacing: -.003em;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::selection { background: var(--accent-soft); }

      /* Every interactive thing gets the same visible focus ring. An
         operator driving this from the keyboard should never have to guess
         where they are, least of all on a screen that arms trading. */
      :where(a, button, input, select, textarea, summary):focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }

      .shell { display: flex; min-height: 100vh; align-items: stretch; }

      /* The rail. Present on every screen so the operator always knows what
         else exists and where they are. */
      .rail {
        flex: 0 0 228px;
        background: var(--rail);
        border-right: 1px solid var(--line);
        padding: 1.35rem .7rem;
      }
      .rail .brand {
        font-weight: 700;
        font-size: .95rem;
        padding: .1rem .65rem 1.15rem;
        letter-spacing: -.02em;
      }
      .rail a {
        display: block;
        padding: .45rem .65rem;
        margin: 1px 0;
        color: var(--muted);
        text-decoration: none;
        border-radius: var(--radius-sm);
        font-size: .9rem;
      }
      .rail a:hover { background: var(--hover); color: var(--ink); }
      /* Where you are, said twice: the accent bar carries it at a glance and
         the weight carries it for anyone who cannot see the colour. */
      .rail a[aria-current="page"] {
        background: var(--surface);
        box-shadow: var(--shadow-sm), inset 3px 0 0 var(--accent);
        color: var(--ink);
        font-weight: 600;
      }
      .rail .group {
        margin-top: 1.15rem;
        padding: 0 .65rem .3rem;
        font-size: .68rem;
        letter-spacing: .09em;
        text-transform: uppercase;
        color: var(--faint);
      }

      /* Capped, because a table stretched across a wide monitor makes the
         eye travel for nothing. */
      .main {
        flex: 1 1 auto;
        min-width: 0;
        padding: 1.75rem 2.25rem 5rem;
        max-width: 1360px;
      }
      .topline {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        border-bottom: 1px solid var(--line);
        padding-bottom: .85rem;
        margin-bottom: 1.6rem;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0;
        letter-spacing: -.022em;
        font-weight: 650;
      }
      /* A rule under each section heading, so the eye finds the boundaries
         of a long screen without reading the words. */
      h2 {
        font-size: 1.02rem;
        font-weight: 650;
        margin: 2.4rem 0 .8rem;
        padding-bottom: .4rem;
        border-bottom: 1px solid var(--line);
        letter-spacing: -.016em;
      }
      h3 {
        font-size: .93rem;
        font-weight: 650;
        margin: 1.5rem 0 .5rem;
        color: var(--ink);
        letter-spacing: -.012em;
      }
      p { margin: .5rem 0; }
      /* Prose stays inside a readable measure; tables and panels do not. */
      .main > p, .panel > p, .note { max-width: 68ch; }
      .main > p.state { max-width: none; }

      /* Read-only summaries are plain; anything that mutates sits in a
         bordered panel. Section 12 asks for the two to be distinguishable
         without reading them. */
      /* A table is a surface, not a grid of rules. Hairlines between rows,
         nothing between columns, and the whole thing lifted a little off the
         canvas - which is what makes the page read as a set of objects
         rather than as one long sheet.

         `separate` rather than `collapse` so the corners can be rounded; the
         alternative, `overflow: hidden` on the table, would kill the sticky
         header. */
      table {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
        font-size: .885rem;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        margin: .9rem 0 1.4rem;
        font-variant-numeric: tabular-nums;
      }
      th, td {
        border-bottom: 1px solid var(--line);
        padding: .62rem .85rem;
        text-align: left;
        vertical-align: top;
      }
      tr:last-child td, tr:last-child th { border-bottom: 0; }
      /* Held while a long table scrolls: a row of numbers with the headings
         off screen is a row of numbers nobody can read. The rule under a
         sticky header is drawn with a shadow, because a border on a sticky
         cell is painted out from under it as it moves. */
      thead th, tr:first-child th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--surface);
        color: var(--faint);
        font-weight: 600;
        font-size: .715rem;
        letter-spacing: .06em;
        text-transform: uppercase;
        border-bottom: 0;
        box-shadow: inset 0 -1px 0 var(--line-strong);
      }
      tr:first-child th:first-child { border-top-left-radius: var(--radius); }
      tr:first-child th:last-child { border-top-right-radius: var(--radius); }
      /* A table with more columns than the window has room for used to
         push its last column out past the card and clip it - which on the
         universe history is the column holding the activate button. It
         scrolls on its own now instead of the page scrolling sideways. */
      .scroller {
        overflow-x: auto;
        margin: .9rem 0 1.4rem;
        border-radius: var(--radius);
      }
      .scroller > table { margin: 0; min-width: 52rem; }

      /* No zebra. At these widths the hairline and the hover carry the row,
         and a stripe under every second row is ink spent on nothing. */
      tbody tr:hover td, tr:hover td { background: var(--hover); }
      td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
      /* Identifiers line up so two that differ are visibly different. */
      td .code, td.code { font-variant-numeric: tabular-nums; }

      .panel {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 1.2rem 1.45rem;
        margin: 1.2rem 0;
        background: var(--raised);
        box-shadow: var(--shadow-sm);
      }
      .panel h2, .panel h3 { margin-top: 0; }
      .panel h2 { border-bottom: 0; padding-bottom: 0; }

      /* A long explanation belongs on the screen it explains, not in a
         document somebody has to already know exists. Collapsed, because
         after the first read it is in the way of the work. */
      /* A day of evaluation as bars. No canvas and no script: the shape
         of the series is a column per hour whose height is a percentage,
         which CSS already draws. What the operator reads off it first is the
         gaps - an hour with no bar is an hour the loop was not running. */
      .series {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 84px;
        padding: 0;
        margin: .2rem 0 0;
        border-bottom: 1px solid var(--line-strong);
      }
      .series > li {
        flex: 1 1 0;
        min-width: 0;
        list-style: none;
        height: 100%;
        display: flex;
        align-items: flex-end;
      }
      .series .bar {
        width: 100%;
        background: linear-gradient(180deg, #2a63a8 0%, var(--accent) 100%);
        border-radius: 3px 3px 0 0;
        min-height: 2px;
      }
      /* An hour that produced an approved setup is the one thing on this
         chart worth interrupting for, so it is the only colour change. */
      .series .bar.took {
        background: linear-gradient(180deg, #1e7a47 0%, var(--ok) 100%);
      }
      .series li.idle .bar {
        background: repeating-linear-gradient(
          45deg, var(--line), var(--line) 1px, transparent 1px, transparent 5px);
        height: 100%;
        border-radius: 0;
        opacity: .8;
      }
      .axis {
        display: flex;
        gap: 2px;
        margin: .3rem 0 0;
        padding: 0;
      }
      .axis > li {
        flex: 1 1 0;
        min-width: 0;
        list-style: none;
        text-align: center;
        font-size: .68rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        /* Every third hour, or twenty-four labels collide into a smear. */
        overflow: hidden;
      }
      .axis > li.quiet { visibility: hidden; }
      /* The numbers under the chart, each one labelled. A bare row of digits
         needs the legend read first, and it never is. */
      .figures {
        display: flex;
        flex-wrap: wrap;
        gap: 1.6rem;
        margin: 1rem 0 0;
        padding: 0;
      }
      .figures > div { min-width: 7rem; }
      .figures dt {
        font-size: .8rem;
        color: var(--muted);
        margin: 0 0 .15rem;
      }
      .figures dd {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 600;
        letter-spacing: -.02em;
        font-variant-numeric: tabular-nums;
        line-height: 1.2;
      }
      .figures dd .unit { font-size: .8rem; color: var(--muted); }

      /* The clock this whole backoffice is written in. Small, always in
         the same place, and never repeated per cell. */
      .zone {
        margin-left: .6rem;
        padding: .12rem .45rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        font-size: .7rem;
        color: var(--faint);
      }

      details.help {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        margin: 1.2rem 0;
        padding: 0 1.45rem;
        background: var(--surface);
        box-shadow: var(--shadow-sm);
      }
      details.help > summary {
        cursor: pointer;
        padding: .75rem 0;
        font-weight: 600;
        font-size: .92rem;
      }
      details.help[open] > summary {
        border-bottom: 1px solid var(--line);
        margin-bottom: .9rem;
      }
      details.help > :last-child { margin-bottom: 1.1rem; }
      details.help h4 {
        margin: 1.2rem 0 .4rem;
        font-size: .9rem;
      }
      details.help ol, details.help ul { max-width: 68ch; padding-left: 1.3rem; }
      details.help li { margin: .4rem 0; font-size: .9rem; }
      details.help p { max-width: 68ch; font-size: .9rem; }
      /* Sample documents scroll on their own rather than widening the page:
         a manifest line is longer than the column and always will be. */
      pre.sample {
        overflow-x: auto;
        max-width: 68ch;
        background: var(--page);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: .8rem 1rem;
        font-family: ui-monospace, "Cascadia Mono", monospace;
        font-size: .78rem;
        line-height: 1.55;
      }

      .code {
        font-family: ui-monospace, "Cascadia Mono", "JetBrains Mono",
          "Consolas", monospace;
        font-size: .8rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .ok { color: var(--ok); font-weight: 600; }
      .danger { color: var(--danger); font-weight: 600; }
      .empty { color: var(--muted); }
      .note { color: var(--muted); font-size: .85rem; }
      .added { color: var(--ok); }
      .removed { color: var(--danger); }

      input, select, textarea {
        padding: .5rem .65rem;
        font: inherit;
        font-size: .9rem;
        color: var(--ink);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        background: var(--surface);
        transition: border-color .12s ease, box-shadow .12s ease;
      }
      input:hover, select:hover, textarea:hover { border-color: #b9c0ca; }
      input:focus, select:focus, textarea:focus {
        border-color: var(--focus);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      label { font-size: .9rem; display: inline-block; }
      /* A field and its label as one block, so a form reads down rather than
         wrapping unpredictably. */
      .field { display: block; margin: .7rem 0; }
      .field > span { display: block; margin-bottom: .25rem; color: var(--muted); }
      .field input, .field select { width: 100%; max-width: 22rem; }
      button {
        padding: .48rem 1rem;
        font: inherit;
        font-size: .875rem;
        font-weight: 550;
        cursor: pointer;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--ink);
        box-shadow: var(--shadow-sm);
        transition: background .12s ease, border-color .12s ease;
      }
      button:hover { background: var(--hover); border-color: #b9c0ca; }
      /* Pressed moves; it is the only motion on the page and it belongs to
         the thing the operator just committed to. */
      button:active { transform: translateY(1px); box-shadow: none; }
      /* Exposure-enabling actions are never the quiet default: they are
         deliberate and green, and they always follow a confirmation panel. */
      .go {
        background: var(--ok);
        color: #fff;
        border-color: #10502d;
        font-weight: 650;
      }
      .go:hover { background: #12572f; border-color: #0d431f; }
      /* Safety actions. Section 12 keeps them prominent and out of the
         dangerous-action dialog: one click, always reachable. */
      .stop {
        background: var(--danger);
        color: #fff;
        border-color: var(--danger-ink);
        font-weight: 650;
      }
      .stop:hover { background: #8e1729; border-color: #6b101e; }
      .quiet { background: transparent; box-shadow: none; color: var(--muted); }
      .quiet:hover { background: var(--hover); }

      .safety {
        display: flex;
        gap: .6rem;
        align-items: center;
        flex-wrap: wrap;
        padding: .85rem 1.1rem;
        border: 1px solid #edd3d8;
        border-left: 4px solid var(--danger);
        border-radius: var(--radius);
        background: var(--danger-bg);
        margin-bottom: 1.6rem;
      }
      .safety button { padding: .55rem 1.1rem; }


      /* Section 9 puts the second password on the step that makes something
         trade. It used to be a field at the bottom of a long screen, which
         meant scrolling past everything to reach the one control that
         matters. It is a dialog now: it opens over the thing it is
         confirming, and the page behind it stays where the operator left it.

         Without JavaScript every dialog renders inline exactly as it did
         before. A safety control that disappears when a script fails is
         worse than one that is inconvenient. */
      html:not(.has-dialog) dialog.confirm {
        display: block;
        position: static;
        width: auto;
        max-width: none;
        box-shadow: none;
        margin: 1rem 0;
      }
      html:not(.has-dialog) .opens-confirm { display: none; }
      dialog.confirm {
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        padding: 1.4rem 1.55rem;
        max-width: 32rem;
        width: calc(100% - 2rem);
        box-shadow: var(--shadow-lg);
        background: var(--surface);
        color: var(--ink);
      }
      dialog.confirm::backdrop {
        background: rgb(16 18 22 / 42%);
        backdrop-filter: blur(2px);
      }
      dialog.confirm h3 { margin-top: 0; }
      dialog.confirm .actions {
        display: flex;
        gap: .6rem;
        align-items: center;
        margin-top: 1rem;
        flex-wrap: wrap;
      }
      dialog.confirm .what {
        border-left: 3px solid var(--line-strong);
        padding-left: .8rem;
        margin: .6rem 0 1rem;
        color: var(--muted);
        font-size: .88rem;
      }
      html.no-dialog dialog.confirm,
      dialog.confirm:not([open]).inline {
        display: block;
        position: static;
        width: auto;
        max-width: none;
        box-shadow: none;
        margin: 1rem 0;
      }

      .flash {
        padding: .75rem 1rem;
        border-radius: var(--radius);
        margin-bottom: 1rem;
        font-size: .9rem;
      }
      .flash.bad { background: var(--danger-bg); border: 1px solid #edd3d8; }
      .flash.good { background: var(--ok-bg); border: 1px solid #cfe4d6; }

      a { color: var(--accent); text-underline-offset: .2em; }

      /* The most important line on the console: whether this account is
         permitted to trade right now. It carried `state` and `running` or
         `halted` and none of the three had a rule, so the one sentence an
         operator opens this page to read rendered as plain text.

         Armed is stated quietly and stopped is stated loudly. That asymmetry
         is deliberate: running is the expected condition and does not need
         to shout, and a halt that looked like ordinary text is how somebody
         reads past it. */
      .state {
        display: flex;
        align-items: baseline;
        gap: .75rem;
        flex-wrap: wrap;
        margin: 0 0 1.1rem;
        padding: 1rem 1.35rem;
        border: 1px solid var(--line);
        border-left: 5px solid var(--faint);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow-sm);
        font-size: .82rem;
        letter-spacing: .04em;
        text-transform: uppercase;
        color: var(--faint);
      }
      /* The status word is the sentence. Everything around it is a caption,
         and it is sized that way rather than being one more phrase in a
         line of grey text. */
      .state strong {
        font-size: 1.5rem;
        font-weight: 650;
        letter-spacing: -.025em;
        text-transform: none;
      }
      .state .code { font-size: .72rem; letter-spacing: .06em; }
      .state.running { border-left-color: var(--ok); }
      .state.halted { border-left-color: var(--danger); }
      /* The same word in a cell: a position with no stop behind it, or a
         BLOCKING severity. Not a whole banner - a marked cell. */
      td.halted {
        color: var(--danger-ink);
        font-weight: 600;
        background: var(--danger-bg);
      }

      /* Four more that the same consolidation dropped, found by the test
         that was written for `halted`. Each is the negative half of a pair
         whose positive half (`ok`) survived, which is why nothing looked
         obviously broken: the yes was green and the no was nothing.

         `missing` is an account that is not enabled, a policy that is not
         bound, a credential that is not stored. Not an error - a state that
         has not been reached - so it is muted rather than red. */
      .missing { color: var(--faint); }
      .missing::before { content: "\00b7\00a0"; }
      /* A row asking to be looked at rather than a row that is wrong:
         withdrawal enabled on a key, a blocking configuration fact. */
      tr.warn td { background: var(--warn-bg); }
      tr.warn:hover td { background: #f9f0dc; }
      /* A sizing field whose value differs from the one in force. The whole
         point of the diff is that this row is not like the others. */
      tr.changed td, tr.changed th {
        background: var(--accent-soft);
        font-weight: 600;
      }
      /* Turning something off is not a dangerous action and not the default
         one either: available, unemphasised, and not red. */
      button.off {
        color: var(--danger-ink);
        border-color: #e2c4ca;
        background: var(--surface);
        font-weight: 550;
      }
      button.off:hover { background: var(--danger-bg); border-color: #d3a9b1; }

      @media (max-width: 900px) {
        .shell { display: block; }
        .rail {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          padding: .75rem 0;
          display: flex;
          flex-wrap: wrap;
          gap: .25rem;
          align-items: center;
        }
        .rail .brand { padding: 0 1rem; }
        .rail .group { display: none; }
        .rail a {
          border-left: 0;
          border-bottom: 3px solid transparent;
          padding: .35rem .7rem;
        }
        .rail a[aria-current="page"] {
          border-left: 0;
          border-bottom-color: var(--accent);
        }
        .main { padding: 1rem 1rem 3rem; }
        table { display: block; overflow-x: auto; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav class="rail">
        <div class="brand">자동매매</div>
        {% set here = request.url.path %}
        <a href="/" {% if here == '/' %}aria-current="page"{% endif %}>운영</a>
        <div class="group">권위</div>
        <a href="/accounts" {% if here.startswith('/accounts') %}aria-current="page"{% endif %}>계정과 자격증명</a>
        <a href="/secrets" {% if here.startswith('/secrets') %}aria-current="page"{% endif %}>비밀값</a>
        <a href="/policies" {% if here.startswith('/policies') %}aria-current="page"{% endif %}>리스크 정책</a>
        <a href="/universe" {% if here.startswith('/universe') %}aria-current="page"{% endif %}>유니버스 권위</a>
        <div class="group">증거</div>
        <a href="/evidence" {% if here.startswith('/evidence') %}aria-current="page"{% endif %}>Provider 증거</a>
        <a href="/promotion" {% if here.startswith('/promotion') %}aria-current="page"{% endif %}>승격</a>
      </nav>
      <main class="main">
        <div class="topline">
          <h1>{% block heading %}{{ self.title() }}{% endblock %}</h1>
          <span class="code">{{ session.operator.email }}
            <span class="zone" title="저장은 UTC입니다">시각 KST</span></span>
        </div>
        {% block content %}{% endblock %}
      </main>
    </div>
    <script>
      // Progressive: the class is added only once this runs, so a page that
      // never gets here keeps the inline forms.
      document.documentElement.classList.add("has-dialog");
      document.addEventListener("click", function (event) {
        var opener = event.target.closest("[data-opens]");
        if (opener) {
          var dialog = document.getElementById(opener.dataset.opens);
          if (dialog && typeof dialog.showModal === "function") {
            event.preventDefault();
            dialog.showModal();
            var first = dialog.querySelector("input:not([type=hidden])");
            if (first) { first.focus(); }
          }
          return;
        }
        var closer = event.target.closest("[data-closes]");
        if (closer) {
          event.preventDefault();
          var owner = closer.closest("dialog");
          if (owner) { owner.close(); }
        }
      });
    </script>
  </body>
</html>
