<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}자동매매{% endblock %}</title>
    <style>
      /* Section 12: desktop-first with a persistent navigation rail and a
         narrow-screen fallback. Eight screens had eight copies of a style
         block, so the same table looked different depending on where the
         operator had clicked. One stylesheet, defined once. */
      :root {
        --ink: #16181d;
        /* Was #6b6b6b, which fails contrast at the sizes it is used at.
           Secondary text on this screen is often the only label a number
           has. */
        --muted: #5a6068;
        --line: #e4e6ea;
        --line-strong: #c3c7ce;
        --page: #ffffff;
        --rail: #f6f7f9;
        --raised: #fbfcfd;
        --hover: #f2f4f7;
        --focus: #1a4fa0;
        --danger: #b00020;
        --danger-ink: #8a0018;
        --ok: #00701a;
        --accent: #1a4fa0;
        --warn-bg: #fff8e1;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--page);
        font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic",
          sans-serif;
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      /* Every interactive thing gets the same visible focus ring. An
         operator driving this from the keyboard should never have to guess
         where they are, least of all on a screen that arms trading. */
      :where(a, button, input, select, textarea, summary):focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
        border-radius: 3px;
      }

      .shell { display: flex; min-height: 100vh; align-items: stretch; }

      /* The rail. Present on every screen so the operator always knows what
         else exists and where they are. */
      .rail {
        flex: 0 0 216px;
        background: var(--rail);
        border-right: 1px solid var(--line);
        padding: 1.25rem 0;
      }
      .rail .brand {
        font-weight: 700;
        font-size: .95rem;
        padding: 0 1.25rem 1rem;
        letter-spacing: -.01em;
      }
      .rail a {
        display: block;
        padding: .5rem 1.25rem;
        color: var(--ink);
        text-decoration: none;
        border-left: 3px solid transparent;
        font-size: .92rem;
      }
      .rail a:hover { background: #efeff1; }
      .rail a[aria-current="page"] {
        border-left-color: var(--accent);
        background: #fff;
        font-weight: 600;
      }
      .rail .group {
        margin-top: 1rem;
        padding: 0 1.25rem .25rem;
        font-size: .72rem;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .main { flex: 1 1 auto; min-width: 0; padding: 1.5rem 2rem 4rem; }
      .topline {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        border-bottom: 1px solid var(--line);
        padding-bottom: .75rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
      }
      h1 { font-size: 1.3rem; margin: 0; letter-spacing: -.015em; }
      /* A rule under each section heading, so the eye finds the boundaries
         of a long screen without reading the words. */
      h2 {
        font-size: 1.02rem;
        margin: 2.2rem 0 .7rem;
        padding-bottom: .35rem;
        border-bottom: 1px solid var(--line);
        letter-spacing: -.01em;
      }
      h3 { font-size: .93rem; margin: 1.5rem 0 .5rem; color: var(--ink); }
      p { margin: .5rem 0; }
      /* Prose stays inside a readable measure; tables and panels do not. */
      .main > p, .panel > p, .note { max-width: 68ch; }

      /* Read-only summaries are plain; anything that mutates sits in a
         bordered panel. Section 12 asks for the two to be distinguishable
         without reading them. */
      table { border-collapse: collapse; width: 100%; font-size: .9rem; }
      th, td {
        border-bottom: 1px solid var(--line);
        padding: .55rem .7rem;
        text-align: left;
        vertical-align: top;
      }
      /* Held while a long table scrolls: a row of numbers with the headings
         off screen is a row of numbers nobody can read. */
      thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--page);
        color: var(--muted);
        font-weight: 600;
        font-size: .78rem;
        letter-spacing: .03em;
        text-transform: uppercase;
        border-bottom: 1px solid var(--line-strong);
      }
      tbody tr:nth-child(even) td { background: #fafbfc; }
      tbody tr:hover td { background: var(--hover); }
      td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
      /* Identifiers line up so two that differ are visibly different. */
      td .code, td.code { font-variant-numeric: tabular-nums; }

      .panel {
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        padding: 1.1rem 1.35rem;
        margin: 1.1rem 0;
        background: var(--raised);
      }
      .panel h2, .panel h3 { margin-top: 0; }
      .panel h2 { border-bottom: 0; padding-bottom: 0; }

      /* A long explanation belongs on the screen it explains, not in a
         document somebody has to already know exists. Collapsed, because
         after the first read it is in the way of the work. */
      /* A day of evaluation as bars. No canvas and no script: the shape
         of the series is a column per hour whose height is a percentage,
         which CSS already draws. What the operator reads off it first is the
         gaps - an hour with no bar is an hour the loop was not running. */
      .series {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 84px;
        padding: 0;
        margin: .2rem 0 0;
        border-bottom: 1px solid var(--line-strong);
      }
      .series > li {
        flex: 1 1 0;
        min-width: 0;
        list-style: none;
        height: 100%;
        display: flex;
        align-items: flex-end;
      }
      .series .bar {
        width: 100%;
        background: var(--accent);
        border-radius: 2px 2px 0 0;
        min-height: 2px;
      }
      /* An hour that produced an approved setup is the one thing on this
         chart worth interrupting for, so it is the only colour change. */
      .series .bar.took { background: var(--ok); }
      .series li.idle .bar {
        background: repeating-linear-gradient(
          45deg, var(--line), var(--line) 2px, transparent 2px, transparent 4px);
        height: 100%;
        border-radius: 0;
        opacity: .55;
      }
      .axis {
        display: flex;
        gap: 2px;
        margin: .3rem 0 0;
        padding: 0;
      }
      .axis > li {
        flex: 1 1 0;
        min-width: 0;
        list-style: none;
        text-align: center;
        font-size: .68rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        /* Every third hour, or twenty-four labels collide into a smear. */
        overflow: hidden;
      }
      .axis > li.quiet { visibility: hidden; }
      /* The numbers under the chart, each one labelled. A bare row of digits
         needs the legend read first, and it never is. */
      .figures {
        display: flex;
        flex-wrap: wrap;
        gap: 1.6rem;
        margin: 1rem 0 0;
        padding: 0;
      }
      .figures > div { min-width: 7rem; }
      .figures dt {
        font-size: .8rem;
        color: var(--muted);
        margin: 0 0 .15rem;
      }
      .figures dd {
        margin: 0;
        font-size: 1.35rem;
        font-variant-numeric: tabular-nums;
        line-height: 1.2;
      }
      .figures dd .unit { font-size: .8rem; color: var(--muted); }

      details.help {
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        margin: 1.1rem 0;
        padding: 0 1.35rem;
        background: var(--rail);
      }
      details.help > summary {
        cursor: pointer;
        padding: .75rem 0;
        font-weight: 600;
        font-size: .92rem;
      }
      details.help[open] > summary {
        border-bottom: 1px solid var(--line);
        margin-bottom: .9rem;
      }
      details.help > :last-child { margin-bottom: 1.1rem; }
      details.help h4 {
        margin: 1.2rem 0 .4rem;
        font-size: .9rem;
      }
      details.help ol, details.help ul { max-width: 68ch; padding-left: 1.3rem; }
      details.help li { margin: .4rem 0; font-size: .9rem; }
      details.help p { max-width: 68ch; font-size: .9rem; }
      /* Sample documents scroll on their own rather than widening the page:
         a manifest line is longer than the column and always will be. */
      pre.sample {
        overflow-x: auto;
        max-width: 68ch;
        background: var(--page);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: .8rem 1rem;
        font-family: ui-monospace, "Cascadia Mono", monospace;
        font-size: .78rem;
        line-height: 1.55;
      }

      .code {
        font-family: ui-monospace, "Cascadia Mono", monospace;
        font-size: .82rem;
        color: var(--muted);
      }
      .ok { color: var(--ok); font-weight: 600; }
      .danger { color: var(--danger); font-weight: 600; }
      .empty { color: var(--muted); }
      .note { color: var(--muted); font-size: .85rem; }
      .added { color: var(--ok); }
      .removed { color: var(--danger); }

      input, select, textarea {
        padding: .5rem .6rem;
        font: inherit;
        font-size: .9rem;
        border: 1px solid var(--line-strong);
        border-radius: 4px;
        background: #fff;
      }
      input:focus, select:focus, textarea:focus { border-color: var(--focus); }
      label { font-size: .9rem; display: inline-block; }
      /* A field and its label as one block, so a form reads down rather than
         wrapping unpredictably. */
      .field { display: block; margin: .7rem 0; }
      .field > span { display: block; margin-bottom: .25rem; color: var(--muted); }
      .field input, .field select { width: 100%; max-width: 22rem; }
      button {
        padding: .5rem .95rem;
        font: inherit;
        font-size: .9rem;
        cursor: pointer;
        border: 1px solid var(--line-strong);
        border-radius: 3px;
        background: #f2f2f4;
        color: var(--ink);
      }
      button:hover { background: #e8e8ec; }
      /* Exposure-enabling actions are never the quiet default: they are
         deliberate and green, and they always follow a confirmation panel. */
      .go {
        background: var(--ok);
        color: #fff;
        border-color: #005414;
        font-weight: 600;
      }
      .go:hover { background: #005f16; }
      /* Safety actions. Section 12 keeps them prominent and out of the
         dangerous-action dialog: one click, always reachable. */
      .stop {
        background: var(--danger);
        color: #fff;
        border-color: var(--danger-ink);
        font-weight: 600;
      }
      .stop:hover { background: #970019; }
      .quiet { background: #f2f2f4; }

      .safety {
        display: flex;
        gap: .6rem;
        align-items: center;
        flex-wrap: wrap;
        padding: .8rem 1rem;
        border: 1px solid var(--line-strong);
        border-left: 4px solid var(--danger);
        border-radius: 4px;
        background: #fffafa;
        margin-bottom: 1.5rem;
      }
      .safety button { padding: .55rem 1.1rem; }


      /* Section 9 puts the second password on the step that makes something
         trade. It used to be a field at the bottom of a long screen, which
         meant scrolling past everything to reach the one control that
         matters. It is a dialog now: it opens over the thing it is
         confirming, and the page behind it stays where the operator left it.

         Without JavaScript every dialog renders inline exactly as it did
         before. A safety control that disappears when a script fails is
         worse than one that is inconvenient. */
      html:not(.has-dialog) dialog.confirm {
        display: block;
        position: static;
        width: auto;
        max-width: none;
        box-shadow: none;
        margin: 1rem 0;
      }
      html:not(.has-dialog) .opens-confirm { display: none; }
      dialog.confirm {
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        padding: 1.25rem 1.4rem;
        max-width: 32rem;
        width: calc(100% - 2rem);
        box-shadow: 0 10px 40px rgb(0 0 0 / 18%);
        color: var(--ink);
      }
      dialog.confirm::backdrop { background: rgb(16 18 22 / 45%); }
      dialog.confirm h3 { margin-top: 0; }
      dialog.confirm .actions {
        display: flex;
        gap: .6rem;
        align-items: center;
        margin-top: 1rem;
        flex-wrap: wrap;
      }
      dialog.confirm .what {
        border-left: 3px solid var(--line-strong);
        padding-left: .8rem;
        margin: .6rem 0 1rem;
        color: var(--muted);
        font-size: .88rem;
      }
      html.no-dialog dialog.confirm,
      dialog.confirm:not([open]).inline {
        display: block;
        position: static;
        width: auto;
        max-width: none;
        box-shadow: none;
        margin: 1rem 0;
      }

      .flash { padding: .7rem 1rem; border-radius: 4px; margin-bottom: 1rem; }
      .flash.bad { background: #fdecef; border: 1px solid #f3c2cc; }
      .flash.good { background: #edf7ef; border: 1px solid #bfe0c6; }

      a { color: var(--accent); }

      @media (max-width: 900px) {
        .shell { display: block; }
        .rail {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          padding: .75rem 0;
          display: flex;
          flex-wrap: wrap;
          gap: .25rem;
          align-items: center;
        }
        .rail .brand { padding: 0 1rem; }
        .rail .group { display: none; }
        .rail a {
          border-left: 0;
          border-bottom: 3px solid transparent;
          padding: .35rem .7rem;
        }
        .rail a[aria-current="page"] {
          border-left: 0;
          border-bottom-color: var(--accent);
        }
        .main { padding: 1rem 1rem 3rem; }
        table { display: block; overflow-x: auto; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav class="rail">
        <div class="brand">자동매매</div>
        {% set here = request.url.path %}
        <a href="/" {% if here == '/' %}aria-current="page"{% endif %}>운영</a>
        <div class="group">권위</div>
        <a href="/accounts" {% if here.startswith('/accounts') %}aria-current="page"{% endif %}>계정과 자격증명</a>
        <a href="/secrets" {% if here.startswith('/secrets') %}aria-current="page"{% endif %}>비밀값</a>
        <a href="/policies" {% if here.startswith('/policies') %}aria-current="page"{% endif %}>리스크 정책</a>
        <a href="/universe" {% if here.startswith('/universe') %}aria-current="page"{% endif %}>유니버스 권위</a>
        <div class="group">증거</div>
        <a href="/evidence" {% if here.startswith('/evidence') %}aria-current="page"{% endif %}>Provider 증거</a>
        <a href="/promotion" {% if here.startswith('/promotion') %}aria-current="page"{% endif %}>승격</a>
      </nav>
      <main class="main">
        <div class="topline">
          <h1>{% block heading %}{{ self.title() }}{% endblock %}</h1>
          <span class="code">{{ session.operator.email }}</span>
        </div>
        {% block content %}{% endblock %}
      </main>
    </div>
    <script>
      // Progressive: the class is added only once this runs, so a page that
      // never gets here keeps the inline forms.
      document.documentElement.classList.add("has-dialog");
      document.addEventListener("click", function (event) {
        var opener = event.target.closest("[data-opens]");
        if (opener) {
          var dialog = document.getElementById(opener.dataset.opens);
          if (dialog && typeof dialog.showModal === "function") {
            event.preventDefault();
            dialog.showModal();
            var first = dialog.querySelector("input:not([type=hidden])");
            if (first) { first.focus(); }
          }
          return;
        }
        var closer = event.target.closest("[data-closes]");
        if (closer) {
          event.preventDefault();
          var owner = closer.closest("dialog");
          if (owner) { owner.close(); }
        }
      });
    </script>
  </body>
</html>
