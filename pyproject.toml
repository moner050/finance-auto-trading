[project]
name = "finance-auto-trading"
version = "0.1.0"
description = "Broker-neutral governed-Shadow safety kernel"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiomysql[rsa]>=0.3.2,<1",
  "argon2-cffi>=25,<26",
  "authlib>=1.6,<2",
  "cryptography>=46,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=7,<8",
  "sqlalchemy[asyncio]>=2.0.51,<3",
  "tzdata>=2025.2,<2027",
  "uvicorn[standard]>=0.35,<1",
  # The aggregate-trade stream. It arrives with uvicorn[standard] today,
  # and a feed the strategy reads order flow from should not depend on
  # another package continuing to want it.
  "websockets>=15,<18",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrader"]

[dependency-groups]
dev = [
  "alembic>=1.19,<2",
  "hypothesis>=6.165,<7",
  "pyright==1.1.411",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff==0.16.2",
]
integration = [
  "testcontainers>=4.15,<5",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
junit_family = "xunit1"
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = [
  "integration: requires external infrastructure",
  "chaos: exercises fault injection",
  "acceptance: verifies an end-to-end safety contract",
]

[tool.ruff]
extend-exclude = ["docs", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# A migration carries generated DDL; its line lengths are the database's,
# not ours.
"migrations/versions/*.py" = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
